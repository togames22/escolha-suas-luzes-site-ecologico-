<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Escolha de aparelhos</title>
 
  <link rel="stylesheet" href="escolha_de_aparelhos.css">
  
  <head> 
    <body>

      <div class = "container">
      <h1>Escolha o número de aparelhos</h1>
        <div class="card">
                <div class="icone">🔋</div>
                <p>3 - 5 aparelhos</p>
            </div>

            <div class="card">
                <div class="icone">🔋</div>
                <p>6 - 8 aparelhos</p>
            </div>

            <div class="card">
                <div class="icone">🔋</div>
                <p>10 ou mais</p>
            </div>

            <div class="card">
                <div class="icone">🌱</div>
                <p>Nossa construção ecológica!</p>
            </div>

        </div>

    </div>

    <div class = "container"></div>

    <h1>Escolha o número de luzes</h1>

      <div class="cards">

            <div class="card">
                <div class="icone">💡</div>
                <p>2 - 4 lâmpadas</p>
            </div>

            <div class="card">
                <div class="icone">💡</div>
                <p>4 - 6 lâmpadas</p>
            </div>

            <div class="card">
                <div class="icone">💡</div>
                <p>8 ou mais</p>
            </div>

            <div class="card ecologico">
                <div class="icone">💡</div>
                <p>Nossa construção ecológica!</p>
            </div>

        </div>

    </div>

    </body>
  </head>
  
  </html>
